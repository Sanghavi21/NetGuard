<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuard | Intrusion Detection System</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-md-2 d-none d-md-block sidebar">
                <h4 class="text-center brand-title mb-4 mt-2">NETGUARD</h4>
                
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('monitor') }}" class="{% if request.endpoint == 'monitor' %}active{% endif %}">Network Monitor</a>
                <a href="{{ url_for('alerts') }}" class="{% if request.endpoint == 'alerts' %}active{% endif %}">Alerts</a>
                <a href="{{ url_for('logs') }}" class="{% if request.endpoint == 'logs' %}active{% endif %}">Security Logs</a>
                <a href="{{ url_for('ips') }}" class="{% if request.endpoint == 'ips' %}active{% endif %}">IP Management</a>
                <a href="{{ url_for('simulation') }}" class="{% if request.endpoint == 'simulation' %}active{% endif %}">Attack Simulation</a>
                <a href="{{ url_for('reports') }}" class="{% if request.endpoint == 'reports' %}active{% endif %}">Reports</a>
                
                <a href="{{ url_for('logout') }}" class="text-danger mt-5">Logout</a>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
